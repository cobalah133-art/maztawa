## I. Kualitas pembinaan dan metode kepelatihan

**11 masalah**

Ini merupakan persoalan paling mendasar. Sebab tugas pelatih bukan sekadar membuat atlet bergerak, berkeringat, dan kelelahan. Tugasnya membangun kemampuan yang bisa digunakan ketika bertanding.

1. **Latihan didominasi praktik tanpa fondasi teori.**

- Atlet diperintahkan menirukan gerakan.
- Penjelasan mengenai fungsi, tujuan, mekanisme, dan penggunaannya sangat minim.
- Atlet akhirnya mengetahui gerakan secara fisik, tetapi belum tentu memahami konsepnya.

**Kritik tajam:** Atlet bukan mesin fotokopi gerakan. Mencontohkan tendangan tidak otomatis berarti mengajarkan ilmu bertanding.

2. **Tidak ada pemecahan teknik menjadi tahapan pembelajaran.**

Contohnya teknik *back kick* yang dalam catatan membutuhkan beberapa tahapan pembentukan gerakan. Sementara yang diterima atlet lebih banyak berupa contoh gerakan akhir.

Akibatnya, atlet dituntut menghasilkan teknik sempurna tanpa mendapatkan proses pembentukannya secara memadai.

**Kritik tajam:** Menuntut hasil akhir tanpa mengajarkan proses adalah kesalahan metode, bukan semata-mata kekurangan kemampuan atlet.

3. **Penggunaan istilah teknis dan bahasa asing tidak efektif.**

Arahan sering menggunakan istilah yang tidak dipahami seluruh atlet. Tidak ada jaminan bahwa seluruh atlet memiliki tingkat pemahaman teknis yang sama.

Akibatnya, instruksi tidak tersampaikan secara optimal.

**Kritik tajam:** Pelatih yang menguasai banyak istilah belum tentu pandai mengajar. Ukuran keberhasilan komunikasi bukan seberapa rumit istilah yang diucapkan, melainkan seberapa baik atlet memahaminya.

4. **Terlalu banyak teknik diberikan tanpa penguasaan mendalam.**

Atlet menerima belasan jenis teknik dalam satu sesi. Materi kemudian berganti sebelum teknik sebelumnya benar-benar dikuasai.

Bahkan beberapa atlet belum mengenal nama teknik yang sudah dipraktikkan.

**Kritik tajam:** Banyaknya materi yang diberikan bukan indikator keberhasilan latihan. Kalau sepuluh teknik diajarkan tetapi tidak satu pun dikuasai dengan benar, itu bukan kemajuan. Itu penumpukan materi.

5. **Tidak ada sistem penggabungan teknik menjadi strategi bertarung.**

Atlet memiliki banyak teknik, tetapi tidak mempunyai formula kombinasi yang jelas untuk digunakan saat *sparring*.

**Contohnya:**

- Teknik pembuka serangan.
- Teknik lanjutan.
- Teknik *counter attack*.
- Kombinasi serangan.
- Penyesuaian terhadap respons lawan.

**Kritik tajam:** Atlet dibekali banyak peluru, tetapi tidak diajari cara membidik, menentukan sasaran, dan kapan harus menembak.

6. **Strategi baru dikoreksi setelah atlet melakukan *sparring*.**

Atlet baru diberi tahu bahwa teknik A harus didahului teknik B setelah kesalahan terjadi.

Padahal ketentuan tersebut seharusnya menjadi bagian dari pembelajaran awal.

Akibatnya, atlet disalahkan atas sesuatu yang belum dijelaskan secara memadai.

7. **Tidak ada program individual berdasarkan karakteristik atlet.**

Dokumen mempertanyakan apakah pelatih pernah mengidentifikasi:

- Kelebihan masing-masing atlet.
- Kekurangan teknik.
- Karakteristik fisik.
- Gaya bertarung.
- Kebutuhan latihan.
- Target perbaikan individual.

Tidak terlihat adanya sistem pembinaan individual yang terdokumentasi dalam catatan tersebut.

**Kritik tajam:** Menyamakan semua atlet dalam satu metode kemudian menyalahkan mereka ketika hasilnya berbeda adalah pendekatan yang perlu dievaluasi serius.

8. **Metode latihan belum menunjukkan adaptasi yang memadai terhadap atlet disabilitas.**

Dokumen secara eksplisit mempertanyakan mengapa metode pembinaan seolah dipaksakan seperti atlet non-disabilitas.

Yang seharusnya diperhatikan adalah kebutuhan adaptasi, kemampuan fungsional, karakteristik setiap atlet, dan pendekatan pembelajaran yang sesuai.

**Kritik tajam:** Atlet disabilitas bukan atlet non-disabilitas yang sekadar diberi label berbeda. Pembinaannya membutuhkan pemahaman yang sesuai dengan kebutuhan atlet.

9. **Beban latihan dan beban berpikir tidak diatur secara optimal.**

Atlet diminta mempelajari banyak teknik, kemudian melakukan *sparring* dalam kondisi fisik sudah kelelahan.

Pada tahap tersebut mereka masih dituntut berpikir cepat, memilih teknik, menyusun kombinasi, dan melakukan *counter attack*.

Padahal materi belum sepenuhnya dipahami.

**Kritik tajam:** Melatih fisik sampai kelelahan lalu mengharapkan kemampuan pengambilan keputusan yang optimal tanpa pembelajaran bertahap adalah sesuatu yang patut dipertanyakan.

10. **Tidak terlihat sistem evaluasi perkembangan yang berkelanjutan.**

Dokumen mempertanyakan apakah penilaian atlet hanya dilakukan melalui tes setiap tiga bulan.

Yang belum terlihat adalah:

- Catatan perkembangan individu.
- Evaluasi teknik.
- Evaluasi strategi.
- Identifikasi kesalahan berulang.
- Target perbaikan.
- Pengukuran keberhasilan program.

**Kritik tajam:** Bagaimana pelatih mengetahui kualitas pembinaannya meningkat jika perkembangan atlet sendiri tidak dicatat dan dianalisis secara konsisten?

11. **Program latihan belum terlihat terhubung dengan kebutuhan pertandingan.**

Latihan banyak berisi pemberian teknik baru, tetapi belum terlihat pemisahan yang jelas antara fase penguasaan teknik, pematangan strategi, simulasi pertandingan, dan evaluasi hasil pertandingan.

**Kritik tajam:** Tujuan latihan bukan membuat atlet hafal banyak gerakan. Tujuannya membuat atlet mampu menggunakan teknik yang tepat pada situasi pertandingan yang sesungguhnya.

## II. Profesionalitas, komunikasi, dan etika pelatih

**7 masalah**

12. **Ketidakhadiran dan keterlambatan tanpa pemberitahuan yang layak.**

Dalam dokumen tercatat beberapa kejadian:

- Pelatih tidak hadir tanpa pemberitahuan di grup.
- Pelatih terlambat berulang kali.
- Ada sesi latihan yang hanya diberikan instruksi melalui WhatsApp.
- Atlet diminta menjalankan latihan sendiri.
- Ketidakhadiran bahkan terjadi berulang pada hari Jumat.

Tercatat pula beberapa kali pelatih datang terlambat hingga sekitar pukul 18.00, bahkan tidak hadir sama sekali.

**Kritik tajam:** Disiplin tidak boleh menjadi kewajiban sepihak. Kalau atlet dituntut tepat waktu, pelatih juga harus memberikan contoh yang sama.

13. **Pengabaian tanggung jawab selama sesi latihan.**

Ada catatan pelatih meninggalkan sesi latihan setelah sekitar 30 menit, sementara atlet masih menjalani kegiatan latihan.

Ada pula catatan pelatih lebih memilih kegiatan latihan lain ketika seharusnya mendampingi tim.

**Kritik tajam:** Jabatan pelatih bukan sekadar hadir untuk memberikan instruksi pembuka, lalu menghilang ketika atlet membutuhkan pendampingan.

14. **Komunikasi hanya berjalan satu arah.**

Pola komunikasi yang digambarkan:

- Pelatih memberikan instruksi.
- Atlet menjalankan.
- Atlet jarang mendapat ruang berdiskusi.
- Informasi disampaikan melalui atlet lain.
- Tidak ada mekanisme komunikasi yang konsisten.

**Kritik tajam:** Grup WhatsApp dibuat untuk komunikasi tim, bukan sekadar tempat atlet menerima perintah ketika pelatih sedang membutuhkan sesuatu.

15. **Penggunaan kata-kata merendahkan dan intimidatif.**

Beberapa ungkapan yang tercatat dalam dokumen antara lain:

- Membandingkan atlet dengan monyet.
- Menyebut atlet seperti gembel.
- Menggunakan perbandingan dengan keledai.
- Menyampaikan kritik dengan nada keras dan mempermalukan.

Ini bukan sekadar persoalan gaya bicara. Ada potensi dampak terhadap harga diri, motivasi, dan kepercayaan diri atlet.

**Kritik tajam:** Menghina atlet tidak membuat teknik tendangannya lebih baik. Merendahkan manusia bukan metode koreksi keterampilan.

16. **Ancaman eliminasi dan degradasi menjadi tekanan dalam pembinaan.**

Dokumen mencatat bahwa ketika muncul masalah latihan, pembahasan eliminasi anggota atau degradasi kerap ikut muncul.

Ancaman semacam ini berpotensi membuat atlet takut menyampaikan masalah dan lebih sibuk menjaga posisi daripada memperbaiki kemampuan.

**Kritik tajam:** Atlet membutuhkan evaluasi yang objektif, bukan suasana latihan yang membuat mereka merasa setiap kesalahan bisa menjadi alasan untuk disingkirkan.

17. **Tanggung jawab kesalahan terlalu banyak dibebankan kepada atlet.**

Ketika teknik tidak berhasil diterapkan, atlet dianggap kurang berpikir, kurang inisiatif, atau kurang mampu.

Sementara pertanyaan tentang kualitas metode pengajaran, kecukupan materi, dan efektivitas koreksi pelatih belum terlihat dijawab secara sistematis.

**Kritik tajam:** Kalau atlet terus dianggap sebagai sumber masalah, kapan pelatih bersedia mengaudit kualitas pengajarannya sendiri?

18. **Inkonsistensi instruksi dan pengaruh suasana hati pelatih.**

Contoh yang tercatat:

- Sebelumnya menekankan makanan bergizi seperti ayam, tempe, dan tahu.
- Kemudian menyampaikan bahwa tanpa susu protein perkembangan otot tidak akan maksimal.
- Beban latihan disebut meningkat ketika suasana hati pelatih sedang tidak baik.
- Target dan perlakuan latihan berubah tanpa penjelasan yang memadai.

**Kritik tajam:** Program latihan seharusnya mengikuti prinsip pembinaan dan kebutuhan atlet, bukan berubah mengikuti suasana hati orang yang memimpin latihan.

## III. Keuangan dan akuntabilitas

**4 masalah**

Ini bagian yang perlu mendapat perhatian khusus. Bukan karena kita sudah bisa menyimpulkan adanya penyalahgunaan dana, tetapi karena terdapat sejumlah aliran uang yang menurut catatan belum memiliki penjelasan dan bukti pertanggungjawaban yang memadai.

19. **Pemotongan uang atlet tanpa transparansi penggunaan.**

Dokumen mencatat adanya pemotongan penghasilan atlet berdasarkan jumlah hari tidak hadir, termasuk karena izin dan sakit.

Dana dikumpulkan dalam bentuk uang tunai melalui amplop, kemudian diberikan kepada pelatih dengan penjelasan bahwa uang tersebut akan diserahkan kepada NPC untuk kebutuhan peralatan.

**Persoalannya:**

- Tidak ada bukti tertulis yang disebutkan.
- Tidak ada dokumentasi penyerahan.
- Tidak ada laporan penggunaan.
- Atlet tidak mengetahui saldo maupun dampak nyata penggunaannya.

**Kritik tajam:** Uang yang dipotong dari hak atlet tidak berubah menjadi uang tanpa pemilik. Setiap rupiah harus memiliki catatan asal, penerima, tujuan, dan pertanggungjawaban.

20. **Dana akomodasi pertandingan Bandung sebesar Rp2,65 juta per atlet.**

Dalam dokumen terdapat dua pencatatan nominal yang sedikit berbeda, yaitu Rp2,6 juta dan Rp2,65 juta per atlet.

Tercatat sekitar 10 atlet diminta menyerahkan dana tersebut dan tidak diperbolehkan menggunakannya sendiri.

Menurut catatan, pada akhirnya hanya Rp500 ribu yang dikembalikan untuk pembelian oleh-oleh. Penggunaan sisa dana belum dijelaskan secara rinci dalam dokumen.

**Hal yang harus diperiksa:**

- Total dana yang benar-benar diterima.
- Rekening penerima.
- Biaya transportasi.
- Penginapan.
- Konsumsi.
- Air minum dan kebutuhan pertandingan.
- Bukti pembayaran.
- Sisa dana dan pengembaliannya.

**Kritik tajam:** Dana akomodasi bukan dana misterius. Kalau seluruhnya digunakan untuk kebutuhan pertandingan, tunjukkan rincian pengeluarannya. Sederhana.

21. **Dana pembinaan atau hadiah juara sebesar Rp6 juta.**

Dokumen menyebut:

- Rp4 juta dari pertandingan Ciracas.
- Rp2 juta dari pertandingan Bandung.
- Sekitar Rp2 juta digunakan membeli empat *headguard*.
- Sisa dana diperkirakan Rp4 juta.

Namun belum ada keterangan penggunaan sisa dana yang memadai.

**Pertanyaan yang harus dijawab:**

- Di mana dana disimpan?
- Siapa pemegangnya?
- Apakah masih utuh?
- Apakah ada pencatatan transaksi?
- Apakah penggunaannya sudah disepakati?

**Kritik tajam:** Dana pembinaan diperoleh dari pencapaian tim. Jangan sampai atlet berjuang mendapatkan prestasi, tetapi tidak mengetahui ke mana hasil finansial dari prestasi tersebut dialokasikan.

22. **Tidak adanya sistem pelaporan dan bukti transaksi yang memadai.**

Ini bukan hanya masalah satu transaksi.

Dokumen berulang kali menyinggung:

- Tidak adanya kuitansi.
- Tidak adanya laporan tertulis.
- Tidak adanya dokumentasi transaksi.
- Pengumpulan uang secara tunai.
- Tidak adanya informasi saldo.
- Tidak jelasnya pihak yang bertanggung jawab.

**Kritik tajam:** Kepercayaan bukan pengganti pembukuan. Bahkan pengelolaan uang dalam jumlah kecil sekalipun tetap membutuhkan pertanggungjawaban.

## IV. Persiapan dan pelaksanaan pertandingan

**3 masalah**

23. **Persoalan klasifikasi berat badan pertandingan.**

Ada catatan atlet kategori K41 yang dimasukkan ke K44, padahal menurut dokumen terdapat kategori berat yang diumumkan untuk masing-masing klasifikasi.

Ini perlu diperiksa melalui daftar pendaftaran dan hasil penimbangan resmi.

**Potensi masalah:**

- Ketidaksesuaian klasifikasi.
- Ketidakadilan kompetisi.
- Perbedaan kondisi pertandingan.
- Risiko keselamatan atlet.

**Kritik tajam:** Klasifikasi bukan formalitas administrasi. Kesalahan penempatan kategori dapat berdampak langsung terhadap keadilan dan keselamatan pertandingan.

24. **Persiapan logistik dan pendampingan pertandingan tidak optimal.**

Contoh dalam catatan:

- Atlet dijadwalkan berangkat pukul 05.00, tetapi pukul 06.00 kendaraan belum siap.
- Atlet tidak selalu mendapatkan pendampingan langsung pelatih.
- Ada persoalan kesiapan transportasi.
- Persiapan sebelum pertandingan belum berjalan sebagaimana mestinya.

**Kritik tajam:** Atlet tidak seharusnya menghabiskan energi menghadapi ketidakpastian logistik sebelum menghadapi lawan di arena.

25. **Kesiapan perlengkapan dan strategi pertandingan belum terorganisasi dengan baik.**

Dokumen mencatat perlunya:

- Memastikan kelengkapan pelindung kepala dan kaki.
- Memastikan *gumshield* sesuai ketentuan.
- Menyiapkan sesi pemanasan.
- Mengamati karakteristik lawan.
- Menyusun strategi berdasarkan pertandingan lawan.
- Memberikan arahan singkat dan efektif kepada atlet.

Ini menunjukkan adanya kebutuhan untuk membuat *checklist* dan sistem persiapan pertandingan yang lebih terstruktur.

## V. Perlindungan dan kondisi atlet

**2 masalah**

26. **Kondisi kesehatan atlet kurang mendapatkan pertimbangan yang memadai.**

Ada catatan seorang atlet mengalami menstruasi hari pertama ketika menjalani tes fisik menjelang pertandingan.

Kondisinya disebut tidak mendukung aktivitas fisik berat, tetapi keluhannya dianggap sebagai alasan umum dan atlet mengalami tekanan emosional.

Ada pula atlet lain yang mengalami kondisi serupa saat tiba di Bandung.

**Kritik tajam:** Disiplin latihan tidak berarti mengabaikan kondisi biologis atlet. Pelatih harus mampu membedakan antara kurang disiplin dan kondisi fisik yang memang membutuhkan penyesuaian.

27. **Tekanan mental dan keamanan psikologis atlet belum menjadi perhatian memadai.**

Dokumen mencatat:

- Atlet merasa takut melakukan kesalahan.
- Ada yang berhenti mengunggah laporan latihan mandiri setelah mendapat koreksi.
- Suasana negatif terbawa hingga pertandingan.
- Tekanan dan komentar keras memengaruhi suasana hati.
- Atlet merasa kelelahan secara mental.

Ini menunjukkan perlunya mekanisme penyampaian keluhan yang aman, evaluasi komunikasi, dan pendekatan koreksi yang konstruktif.

**Kritik tajam:** Kalau atlet takut menunjukkan perkembangan karena khawatir dipermalukan, maka sistem pembinaan sedang kehilangan salah satu fondasi terpentingnya: kepercayaan.

## VI. Evaluasi, pengawasan, dan tanggung jawab organisasi

**1 masalah**

28. **Tidak terlihatnya sistem pengawasan dan evaluasi tanggung jawab pelatih secara terukur.**

Ini merupakan persoalan yang menaungi hampir semua masalah sebelumnya.

Dalam dokumen, atlet dituntut:

- Hadir dan melaporkan ketidakhadiran.
- Menjalankan program latihan.
- Menerima pemotongan penghasilan.
- Mengikuti evaluasi.
- Memenuhi target prestasi.
- Bertanggung jawab atas hasil pertandingan.

Namun belum terlihat sistem yang setara untuk menilai:

- Kehadiran pelatih.
- Kualitas program latihan.
- Kinerja pelatih.
- Kepatuhan terhadap jadwal.
- Transparansi penggunaan dana.
- Evaluasi hasil pembinaan.
- Tindak lanjut atas keluhan atlet.

**Kritik tajam:** Organisasi tidak boleh hanya memiliki sistem pengawasan untuk atlet, tetapi membiarkan kinerja pelatih berjalan tanpa ukuran dan pertanggungjawaban yang jelas.

Atlet memiliki kewajiban. Pelatih juga memiliki kewajiban. Keduanya harus bisa dievaluasi.

## VII. Persoalan tambahan di luar 28 masalah utama

**1 isu terpisah**

Pada halaman 7 terdapat catatan mengenai penggunaan uang, renovasi tempat kos, dan pengembalian dana Rp700 ribu yang belum diselesaikan sesuai waktu yang dijanjikan.

Terdapat beberapa persoalan:

- Penggunaan dana tanpa bukti pembayaran.
- Pengeluaran yang dinilai tidak sesuai kesepakatan.
- Permintaan pengembalian dana Rp700 ribu.
- Janji pengembalian pada tanggal 1 yang belum terealisasi hingga minggu ketiga.
- Tawaran penyelesaian dengan sistem cicilan.

Saya sengaja tidak memasukkannya ke dalam 28 masalah tim karena belum cukup jelas apakah ini berkaitan dengan pelatih, pengelola tempat tinggal, atau pihak lain. Kalau akan dilaporkan, sebaiknya dibuat sebagai laporan terpisah.

## VIII. Masalah tambahan yang muncul dari evaluasi pertandingan

Ada satu hal penting yang tidak boleh hilang dalam laporan.

Dokumen ini bukan hanya berisi kritik terhadap pelatih. Ada juga evaluasi objektif terhadap performa atlet sendiri.

Misalnya:

| Aspek | Temuan |
|---|---|
| Teknik | Banyak teknik latihan belum digunakan saat pertandingan |
| Strategi | Kesulitan menghadapi lawan yang merapat, memeluk, dan mendorong |
| Serangan | Kurang agresif memilih teknik sesuai posisi lawan |
| Potensi | *Checking*, *back step dollyo*, *dwi chagi*, *narae chagi*, dan teknik lainnya belum optimal digunakan |
| Kekuatan | *Power* tendangan, pengelolaan emosi, dan pengamatan waktu cukup baik |
| Ketahanan | Ketahanan napas tiga ronde/set dinilai baik |
| Mental | Kekecewaan atas kekalahan dan belum optimalnya penerapan teknik |

Ini justru bisa memperkuat laporan.

Kamu tidak sedang mengatakan bahwa semua kegagalan merupakan kesalahan pelatih. Kamu mengakui bahwa atlet juga memiliki kekurangan.

Tetapi ada perbedaan mendasar:

Atlet bertanggung jawab menjalankan dan mengembangkan kemampuan. Pelatih bertanggung jawab memastikan proses pembinaan yang diberikan memang layak, terarah, dan efektif.

Keduanya tidak boleh saling melempar tanggung jawab.

## IX. Temuan paling serius yang perlu diprioritaskan

Dari 28 masalah tersebut, menurut saya ada enam persoalan yang perlu menjadi prioritas pemeriksaan organisasi.

**Prioritas pemeriksaan**

**Tinggi**

1. **Pertanggungjawaban dana atlet**

Dana potongan absensi, akomodasi, dan hadiah pembinaan harus ditelusuri. Minta laporan saldo, bukti transaksi, dan pihak penerima.

2. **Kehadiran dan pelaksanaan tugas pelatih**

Periksa jadwal, absensi, pemberitahuan ketidakhadiran, serta siapa yang bertanggung jawab ketika pelatih tidak hadir.

3. **Kesesuaian metode pembinaan dengan kebutuhan atlet disabilitas**

Periksa apakah program latihan sudah disesuaikan dengan klasifikasi, kemampuan, dan kebutuhan individual atlet.

4. **Perlakuan dan tekanan psikologis terhadap atlet**

Periksa dugaan penghinaan, intimidasi, ancaman eliminasi, dan respons pelatih terhadap keluhan atlet.

5. **Kualitas program dan evaluasi prestasi**

Minta program latihan tertulis, evaluasi setiap atlet, target perkembangan, dan rencana perbaikan menuju kompetisi berikutnya.

6. **Pengawasan organisasi terhadap pelatih**

Periksa mekanisme evaluasi kinerja, pertanggungjawaban tugas, pengelolaan dana, dan saluran pengaduan atlet.

## X. Bukti yang perlu dikumpulkan sebelum laporan diserahkan

Jangan hanya mengandalkan narasi. Buat laporan yang memiliki bukti pendukung.

| Persoalan | Bukti yang diperlukan |
|---|---|
| Ketidakhadiran pelatih | Absensi, jadwal, tangkapan layar grup |
| Keterlambatan | Catatan waktu dan dokumentasi |
| Metode latihan | Program latihan, video, catatan materi |
| Penghinaan | Saksi, rekaman, pesan tertulis |
| Pemotongan uang | Slip penghasilan, daftar potongan |
| Dana Bandung | Bukti transfer, kuitansi, rincian pengeluaran |
| Dana juara | Bukti penerimaan hadiah dan pembelian alat |
| Klasifikasi pertandingan | Formulir pendaftaran dan hasil penimbangan |
| Tekanan terhadap atlet | Kesaksian atlet dan kronologi kejadian |
| Evaluasi prestasi | Hasil pertandingan dan catatan perkembangan |

Khusus masalah keuangan, jangan langsung menggunakan istilah penggelapan atau korupsi. Gunakan istilah dugaan ketidaktransparanan dan belum terpenuhinya pertanggungjawaban keuangan sampai pemeriksaan membuktikan lebih jauh.

## XI. Kesimpulan besar dari dokumen

Ada satu pola yang sangat menonjol.

Atlet dituntut menghasilkan prestasi, tetapi sistem yang mendukung pencapaian prestasi tersebut belum terlihat berjalan dengan kualitas yang sebanding.

Atlet diminta disiplin, tetapi kedisiplinan pelatih dipertanyakan.

Atlet diminta memahami teknik, tetapi metode transfer ilmunya dipertanyakan.

Atlet diminta bertanggung jawab atas kekalahan, tetapi evaluasi kualitas pembinaan belum terlihat.

Atlet diminta menyerahkan uang, tetapi transparansi penggunaannya dipertanyakan.

Atlet diminta meningkatkan mental, tetapi perlakuan yang diterima justru berpotensi melemahkan mental.

Dan inilah kritik paling mendasar:

> Jangan hanya mengukur kualitas atlet dari medali yang berhasil dibawa pulang. Ukur juga kualitas orang-orang yang bertanggung jawab membentuk atlet tersebut.

Target emas 2028 tidak cukup dibangun dengan tuntutan, teriakan, hukuman, dan penambahan materi latihan.

Diperlukan sistem pembinaan yang bisa dipertanggungjawabkan.

## XII. Rekomendasi penyusunan laporan resmi

Saya menyarankan laporan ini jangan dibuat sebagai satu tulisan panjang berisi kemarahan. Pisahkan menjadi enam bab agar organisasi tidak bisa menghindari substansi persoalan.

- Evaluasi profesionalitas dan kedisiplinan pelatih.
- Evaluasi metode pembinaan dan kualitas transfer ilmu.
- Evaluasi komunikasi, etika, dan perlindungan atlet.
- Audit transparansi dan pertanggungjawaban keuangan.
- Evaluasi persiapan, pelaksanaan, dan hasil pertandingan.
- Tuntutan perbaikan sistem dan rekomendasi tindak lanjut organisasi.

Setiap bab sebaiknya memiliki empat bagian: kronologi, permasalahan, dampak terhadap atlet, dan tuntutan perbaikan.

Satu hal yang ingin saya tekankan: jangan sampai laporan ini hanya berakhir sebagai surat keluhan yang dibaca, kemudian disimpan, lalu dilupakan.

Laporan harus meminta jawaban konkret, penanggung jawab, tenggat waktu, dan bukti tindak lanjut.

Menurut saya, dokumen ini sudah memiliki bahan yang cukup untuk menjadi laporan evaluasi serius. Tinggal kita ubah dari catatan pengalaman menjadi dokumen pertanggungjawaban yang sistematis.

Langkah berikutnya yang paling tepat adalah menyusun laporan resmi dengan 28 temuan tersebut, lengkap dengan kronologi, analisis, tingkat urgensi, dan rekomendasi tindakan untuk masing-masing masalah.

  <script type="text/markdown" id="markdown-source">
# Catatan Evaluasi Kualitas Pembinaan Atlet Para Taekwondo NPCI Jakarta

## Pembukaan

Kualitas pembinaan menjadi salah satu aspek utama yang perlu ditinjau karena berpengaruh langsung terhadap perkembangan kemampuan dan kesiapan atlet menghadapi pertandingan. Evaluasi pada bagian ini mencakup penyampaian materi, tahapan penguasaan teknik, penyusunan strategi, penyesuaian latihan dengan kebutuhan setiap atlet, serta pemantauan perkembangan secara berkala. Catatan berikut merangkum hal-hal yang perlu diklarifikasi dan diperiksa melalui program latihan, evaluasi atlet, serta keterangan pihak terkait.

## I. Kualitas pembinaan dan metode kepelatihan

**11 masalah**

Ini merupakan persoalan paling mendasar. Sebab tugas pelatih bukan sekadar membuat atlet bergerak, berkeringat, dan kelelahan. Tugasnya membangun kemampuan yang bisa digunakan ketika bertanding.

1. **Latihan didominasi praktik tanpa fondasi teori.**

- Atlet diperintahkan menirukan gerakan.
- Penjelasan mengenai fungsi, tujuan, mekanisme, dan penggunaannya sangat minim.
- Atlet akhirnya mengetahui gerakan secara fisik, tetapi belum tentu memahami konsepnya.

> Atlet bukan mesin fotokopi gerakan. Mencontohkan tendangan tidak otomatis berarti mengajarkan ilmu bertanding.

2. **Tidak ada pemecahan teknik menjadi tahapan pembelajaran.**

Contohnya teknik *back kick* yang dalam catatan membutuhkan beberapa tahapan pembentukan gerakan. Sementara yang diterima atlet lebih banyak berupa contoh gerakan akhir.

Akibatnya, atlet dituntut menghasilkan teknik sempurna tanpa mendapatkan proses pembentukannya secara memadai.

> Menuntut hasil akhir tanpa mengajarkan proses adalah kesalahan metode, bukan semata-mata kekurangan kemampuan atlet.

3. **Penggunaan istilah teknis dan bahasa asing tidak efektif.**

Arahan sering menggunakan istilah yang tidak dipahami seluruh atlet. Tidak ada jaminan bahwa seluruh atlet memiliki tingkat pemahaman teknis yang sama.

Akibatnya, instruksi tidak tersampaikan secara optimal.

> Pelatih yang menguasai banyak istilah belum tentu pandai mengajar. Ukuran keberhasilan komunikasi bukan seberapa rumit istilah yang diucapkan, melainkan seberapa baik atlet memahaminya.

4. **Terlalu banyak teknik diberikan tanpa penguasaan mendalam.**

Atlet menerima belasan jenis teknik dalam satu sesi. Materi kemudian berganti sebelum teknik sebelumnya benar-benar dikuasai.

Bahkan beberapa atlet belum mengenal nama teknik yang sudah dipraktikkan.

> Banyaknya materi yang diberikan bukan indikator keberhasilan latihan. Kalau sepuluh teknik diajarkan tetapi tidak satu pun dikuasai dengan benar, itu bukan kemajuan. Itu penumpukan materi.

5. **Tidak ada sistem penggabungan teknik menjadi strategi bertarung.**

Atlet memiliki banyak teknik, tetapi tidak mempunyai formula kombinasi yang jelas untuk digunakan saat *sparring*.

Contohnya:

- Teknik pembuka serangan.
- Teknik lanjutan.
- Teknik *counter attack*.
- Kombinasi serangan.
- Penyesuaian terhadap respons lawan.

> Atlet dibekali banyak peluru, tetapi tidak diajari cara membidik, menentukan sasaran, dan kapan harus menembak.

6. **Strategi baru dikoreksi setelah atlet melakukan sparring.**

Atlet baru diberi tahu bahwa teknik A harus didahului teknik B setelah kesalahan terjadi.

Padahal ketentuan tersebut seharusnya menjadi bagian dari pembelajaran awal.

Akibatnya, atlet disalahkan atas sesuatu yang belum dijelaskan secara memadai.

7. **Tidak ada program individual berdasarkan karakteristik atlet.**

Kami mempertanyakan apakah pelatih pernah mengidentifikasi:

- Kelebihan masing-masing atlet.
- Kekurangan teknik atlet.
- Karakteristik fisik.
- Gaya bertarung.
- Kebutuhan latihan.
- Target perbaikan individual.

Tidak terlihat adanya sistem pembinaan individual yang terdokumentasi dalam catatan tersebut.

> Menyamakan semua atlet dalam satu metode kemudian menyalahkan mereka ketika hasilnya berbeda adalah pendekatan yang perlu dievaluasi serius.

8. **Metode latihan belum menunjukkan adaptasi yang memadai terhadap atlet disabilitas.**

Secara eksplisit kita mempertanyakan mengapa metode pembinaan seolah dipaksakan seperti atlet non-disabilitas.

Yang seharusnya diperhatikan adalah kebutuhan adaptasi, kemampuan fungsional, karakteristik setiap atlet, dan pendekatan pembelajaran yang sesuai.

> Atlet disabilitas bukan atlet non-disabilitas yang sekadar diberi label berbeda. Pembinaannya membutuhkan pemahaman yang sesuai dengan kebutuhan atlet.

9. **Beban latihan dan beban berpikir tidak diatur secara optimal.**

Atlet diminta mempelajari banyak teknik, kemudian melakukan sparring dalam kondisi fisik sudah kelelahan.

Pada tahap tersebut mereka masih dituntut berpikir cepat, memilih teknik, menyusun kombinasi, dan melakukan counter attack.

Padahal materi belum sepenuhnya dipahami.

> Melatih fisik sampai kelelahan lalu mengharapkan kemampuan pengambilan keputusan yang optimal tanpa pembelajaran bertahap adalah sesuatu yang patut dipertanyakan.

10. **Tidak terlihat sistem evaluasi perkembangan yang berkelanjutan.**

Kami mempertanyakan apakah penilaian atlet hanya dilakukan melalui tes setiap tiga bulan.

Yang belum terlihat adalah:

- Catatan perkembangan individu.
- Evaluasi teknik.
- Evaluasi strategi.
- Identifikasi kesalahan berulang.
- Target perbaikan.
- Pengukuran keberhasilan program.

> Bagaimana pelatih mengetahui kualitas pembinaannya meningkat jika perkembangan atlet sendiri tidak dicatat dan dianalisis secara konsisten?

11. **Program latihan belum terlihat terhubung dengan kebutuhan pertandingan.**

Latihan banyak berisi pemberian teknik baru, tetapi belum terlihat pemisahan yang jelas antara fase penguasaan teknik, pematangan strategi, simulasi pertandingan, dan evaluasi hasil pertandingan.

> Tujuan latihan bukan membuat atlet hafal banyak gerakan. Tujuannya membuat atlet mampu menggunakan teknik yang tepat pada situasi pertandingan yang sesungguhnya.

## II. Profesionalitas, komunikasi, dan etika pelatih

**7 masalah**

12. **Ketidakhadiran dan keterlambatan tanpa pemberitahuan yang layak.**

Kami memperhatikan beberapa kejadian:

- Pelatih tidak hadir tanpa pemberitahuan di grup.
- Pelatih terlambat berulang kali.
- Ada sesi latihan yang hanya diberikan instruksi melalui WhatsApp.
- Atlet diminta menjalankan latihan sendiri.
- Ketidakhadiran bahkan terjadi berulang pada hari Jumat.

Tercatat pula beberapa kali pelatih datang terlambat hingga sekitar pukul 18.00 (jadwal latihan mulai pukul 16.30), bahkan tidak hadir sama sekali.

> Disiplin tidak boleh menjadi kewajiban sepihak. Kalau atlet dituntut tepat waktu, pelatih juga harus memberikan contoh yang sama.

13. **Pengabaian tanggung jawab selama sesi latihan.**

Ada catatan pelatih meninggalkan sesi latihan setelah sekitar 30 menit, sementara atlet masih menjalani kegiatan latihan.

Ada pula catatan pelatih lebih memilih kegiatan lain ketika seharusnya mendampingi tim.

> Jabatan pelatih bukan sekadar hadir untuk memberikan instruksi pembuka, lalu menghilang ketika atlet membutuhkan pendampingan.

14. **Komunikasi hanya berjalan satu arah.**

Pola komunikasi yang digambarkan:

- Pelatih memberikan instruksi.
- Atlet menjalankan.
- Atlet jarang mendapat ruang berdiskusi.
- Informasi disampaikan melalui atlet lain.
- Tidak ada mekanisme komunikasi yang konsisten.

> Grup WhatsApp dibuat untuk komunikasi tim, bukan sekadar tempat atlet menerima perintah ketika pelatih sedang membutuhkan sesuatu.

15. **Penggunaan kata-kata merendahkan dan intimidatif.**

Beberapa ungkapan yang tercatat dalam dokumen antara lain:

- Membandingkan atlet dengan monyet.
- Menyebut atlet seperti gembel, dongo.
- Menggunakan perbandingan dengan keledai.
- Menyampaikan kritik dengan nada keras dan mempermalukan.

Ini bukan sekadar persoalan gaya bicara. Ada potensi dampak terhadap harga diri, motivasi, dan kepercayaan diri atlet.

> Menghina atlet tidak membuat teknik tendangannya lebih baik. Merendahkan manusia bukan metode koreksi keterampilan.

16. **Ancaman eliminasi dan degradasi menjadi tekanan dalam pembinaan.**

Dokumen mencatat bahwa ketika muncul masalah latihan, pembahasan eliminasi anggota atau degradasi kerap ikut muncul.

Ancaman semacam ini berpotensi membuat atlet takut menyampaikan masalah dan lebih sibuk menjaga posisi daripada memperbaiki kemampuan.

> Atlet membutuhkan evaluasi yang objektif, bukan suasana latihan yang membuat mereka merasa setiap kesalahan bisa menjadi alasan untuk disingkirkan.

17. **Tanggung jawab kesalahan terlalu banyak dibebankan kepada atlet.**

Ketika teknik tidak berhasil diterapkan, atlet dianggap kurang berpikir, kurang inisiatif, atau kurang mampu.

Sementara pertanyaan tentang kualitas metode pengajaran, kecukupan materi, dan efektivitas koreksi pelatih belum terlihat dijawab secara sistematis.

> Kalau atlet terus dianggap sebagai sumber masalah, kapan pelatih bersedia mengaudit kualitas pengajarannya sendiri?

18. **Inkonsistensi instruksi dan pengaruh suasana hati pelatih.**

Contoh yang tercatat:

- Sebelumnya menekankan makanan bergizi seperti ayam, tempe, dan tahu.
- Kemudian menyampaikan bahwa tanpa susu protein perkembangan otot tidak akan maksimal.
- Beban latihan lantas meningkat ketika suasana hati pelatih sedang tidak baik.
- Target dan perlakuan latihan berubah tanpa penjelasan yang memadai.

> Program latihan seharusnya mengikuti prinsip pembinaan dan kebutuhan atlet, bukan berubah mengikuti suasana hati orang yang memimpin latihan.

## III. Keuangan dan akuntabilitas

**4 masalah**

Ini bagian yang perlu mendapat perhatian khusus. Bukan karena kita sudah bisa menyimpulkan adanya penyalahgunaan dana, tetapi karena terdapat sejumlah aliran uang yang menurut catatan belum memiliki penjelasan dan bukti pertanggungjawaban yang memadai.

19. **Pemotongan uang atlet tanpa transparansi penggunaan.**

Dokumen mencatat adanya pemotongan penghasilan atlet berdasarkan jumlah hari tidak hadir, termasuk karena izin dan sakit.

Dana dikumpulkan dalam bentuk uang tunai melalui amplop, kemudian diberikan kepada pelatih dengan penjelasan bahwa uang tersebut akan diserahkan kepada NPC untuk kebutuhan peralatan.

Persoalannya:

- Tidak ada bukti tertulis yang disebutkan.
- Tidak ada dokumentasi penyerahan.
- Tidak ada laporan penggunaan.
- Atlet tidak mengetahui saldo maupun dampak nyata penggunaannya.

> Uang yang dipotong dari hak atlet tidak berubah menjadi uang tanpa pemilik. Setiap rupiah harus memiliki catatan asal, penerima, tujuan, dan pertanggungjawaban.

20. **Dana akomodasi pertandingan Bandung sebesar Rp2,6 juta per atlet.**

Tercatat sekitar 10 atlet (total 26 juta) diminta pelatih untuk menyerahkan dana tersebut dan tidak diperbolehkan menggunakannya sendiri.

Pada akhirnya hanya Rp500 ribu yang dikembalikan untuk pembelian oleh-oleh. Penggunaan sisa dana belum dijelaskan secara rinci dalam dokumen.

Hal yang harus diperiksa:

- Total dana yang benar-benar diterima.
- Rekening penerima.
- Biaya transportasi.
- Penginapan.
- Konsumsi.
- Air minum dan kebutuhan pertandingan.
- Bukti pembayaran.
- Sisa dana dan pengembaliannya.

> Dana akomodasi bukan dana misterius. Kalau seluruhnya digunakan untuk kebutuhan pertandingan, tunjukkan rincian pengeluarannya. Sederhana.

21. **Dana pembinaan atau hadiah juara sebesar Rp6 juta.**

Dengan rincian:

- Rp4 juta dari pertandingan Ciracas.
- Rp2 juta dari pertandingan Bandung.
- Sekitar Rp2 juta digunakan membeli empat headguard.
- Sisa dana diperkirakan Rp4 juta.

Namun belum ada keterangan penggunaan sisa dana yang memadai.

Pertanyaan yang harus dijawab:

- Di mana dana disimpan?
- Siapa pemegangnya?
- Apakah masih utuh?
- Apakah ada pencatatan transaksi?
- Apakah penggunaannya sudah disepakati?

> Dana pembinaan diperoleh dari pencapaian tim. Jangan sampai atlet berjuang mendapatkan prestasi, tetapi tidak mengetahui ke mana hasil finansial dari prestasi tersebut dialokasikan.

22. **Tidak adanya sistem pelaporan dan bukti transaksi yang memadai.**

Ini bukan hanya masalah satu transaksi.

Masalah utama:

- Tidak adanya kuitansi.
- Tidak adanya laporan tertulis.
- Tidak adanya dokumentasi transaksi.
- Pengumpulan uang secara tunai.
- Tidak adanya informasi saldo.
- Tidak jelasnya pihak yang bertanggung jawab.

> Kepercayaan bukan pengganti pembukuan. Bahkan pengelolaan uang dalam jumlah kecil sekalipun tetap membutuhkan pertanggungjawaban.

## IV. Persiapan dan pelaksanaan pertandingan

**3 masalah**

23. **Persoalan klasifikasi berat badan pertandingan.**

Ada catatan atlet kategori K41 yang dimasukkan ke K44, padahal menurut dokumen terdapat kategori berat yang diumumkan untuk masing-masing klasifikasi.

Ini perlu diperiksa melalui daftar pendaftaran dan hasil penimbangan resmi.

Potensi masalah:

- Ketidaksesuaian klasifikasi.
- Ketidakadilan kompetisi.
- Perbedaan kondisi pertandingan.
- Risiko keselamatan atlet.

> Klasifikasi bukan formalitas administrasi. Kesalahan penempatan kategori dapat berdampak langsung terhadap keadilan dan keselamatan pertandingan.

24. **Persiapan logistik dan pendampingan pertandingan tidak optimal.**

Contoh dalam catatan:

- Atlet dijadwalkan berangkat pukul 05.00, tetapi pukul 06.00 kendaraan belum siap.
- Atlet tidak selalu mendapatkan pendampingan langsung pelatih.
- Ada persoalan kesiapan transportasi.
- Persiapan sebelum pertandingan belum berjalan sebagaimana mestinya.

> Atlet tidak seharusnya menghabiskan energi menghadapi ketidakpastian logistik sebelum menghadapi lawan di arena.

25. **Kesiapan perlengkapan dan strategi pertandingan belum terorganisasi dengan baik.**

Kita mencatat perlunya:

- Memastikan kelengkapan pelindung kepala dan kaki.
- Memastikan gumshield sesuai ketentuan.
- Menyiapkan sesi pemanasan.
- Mengamati karakteristik lawan.
- Menyusun strategi berdasarkan pertandingan lawan.
- Memberikan arahan singkat dan efektif kepada atlet.

Ini menunjukkan adanya kebutuhan untuk membuat checklist dan sistem persiapan pertandingan yang lebih terstruktur.

## V. Perlindungan dan kondisi atlet

**2 masalah**

26. **Kondisi kesehatan atlet kurang mendapatkan pertimbangan yang memadai.**

Ada catatan seorang atlet mengalami menstruasi hari pertama ketika menjalani tes fisik menjelang pertandingan.

Kondisinya disebut tidak mendukung aktivitas fisik berat, tetapi keluhannya dianggap sebagai alasan umum dan atlet mengalami tekanan emosional.

Ada pula atlet lain yang mengalami kondisi serupa saat tiba di Bandung.

> Disiplin latihan tidak berarti mengabaikan kondisi biologis atlet. Pelatih harus mampu membedakan antara kurang disiplin dan kondisi fisik yang memang membutuhkan penyesuaian.

27. **Tekanan mental dan keamanan psikologis atlet belum menjadi perhatian memadai.**

Diantaranya:

- Atlet merasa takut melakukan kesalahan.
- Ada yang berhenti mengunggah laporan latihan mandiri setelah mendapat koreksi.
- Suasana negatif terbawa hingga pertandingan.
- Tekanan dan komentar keras memengaruhi suasana hati.
- Atlet merasa kelelahan secara mental.

Ini menunjukkan perlunya mekanisme penyampaian keluhan yang aman, evaluasi komunikasi, dan pendekatan koreksi yang konstruktif.

> Kalau atlet takut menunjukkan perkembangan karena khawatir dipermalukan, maka sistem pembinaan sedang kehilangan salah satu fondasi terpentingnya: kepercayaan.

## VI. Evaluasi, pengawasan, dan tanggung jawab organisasi

**1 masalah**

28. **Tidak terlihatnya sistem pengawasan dan evaluasi tanggung jawab pelatih secara terukur.**

Ini merupakan persoalan yang menaungi hampir semua masalah sebelumnya.

Dalam hal ini, atlet dituntut:

- Hadir dan melaporkan ketidakhadiran.
- Menjalankan program latihan.
- Menerima pemotongan penghasilan.
- Mengikuti evaluasi.
- Memenuhi target prestasi.
- Bertanggung jawab atas hasil pertandingan.

Namun belum terlihat sistem yang setara untuk menilai:

- Kehadiran pelatih.
- Kualitas program latihan.
- Kinerja pelatih.
- Kepatuhan terhadap jadwal.
- Transparansi penggunaan dana.
- Evaluasi hasil pembinaan.
- Tindak lanjut atas keluhan atlet.

> Organisasi tidak boleh hanya memiliki sistem pengawasan untuk atlet, tetapi membiarkan kinerja pelatih berjalan tanpa ukuran dan pertanggungjawaban yang jelas.

Atlet memiliki kewajiban. Pelatih juga memiliki kewajiban. Keduanya harus bisa dievaluasi.

## VII. Masalah tambahan yang muncul dari evaluasi pertandingan

Ada satu hal penting yang tidak boleh hilang dalam hal ini.

Dokumen ini bukan hanya berisi kritik terhadap pelatih. Ada juga evaluasi objektif terhadap performa atlet sendiri.

Misalnya:

| Aspek | Temuan |
|---|---|
| Teknik | Banyak teknik latihan belum digunakan saat pertandingan |
| Strategi | Kesulitan menghadapi lawan yang merapat, memeluk, dan mendorong |
| Serangan | Kurang agresif memilih teknik sesuai posisi lawan |
| Potensi | Checking, back step dollyo, dwi chagi, narae chagi, dan teknik lainnya belum optimal digunakan |
| Kekuatan | Power tendangan, pengelolaan emosi, dan pengamatan waktu cukup baik |
| Ketahanan | Ketahanan napas tiga ronde/set dinilai baik |
| Mental | Kekecewaan atas kekalahan dan belum optimalnya penerapan teknik |

Kami tidak sedang mengatakan bahwa semua kegagalan merupakan kesalahan pelatih. Kami mengakui bahwa atlet juga memiliki kekurangan.

Tetapi ada perbedaan mendasar:

Atlet bertanggung jawab menjalankan dan mengembangkan kemampuan. Pelatih bertanggung jawab memastikan proses pembinaan yang diberikan memang layak, terarah, dan efektif.

Keduanya tidak boleh saling melempar tanggung jawab.

## VIII. Temuan paling serius yang perlu diprioritaskan

Dari 28 masalah tersebut, menurut saya ada enam persoalan yang perlu menjadi prioritas pemeriksaan organisasi.

**Prioritas pemeriksaan**

**Tinggi**

1. **Pertanggungjawaban dana atlet**

Dana potongan absensi, akomodasi, dan hadiah pembinaan harus ditelusuri. Minta laporan saldo, bukti transaksi, dan pihak penerima.

2. **Kehadiran dan pelaksanaan tugas pelatih**

Periksa jadwal, absensi, pemberitahuan ketidakhadiran, serta siapa yang bertanggung jawab ketika pelatih tidak hadir.

3. **Kesesuaian metode pembinaan dengan kebutuhan atlet disabilitas**

Periksa apakah program latihan sudah disesuaikan dengan klasifikasi, kemampuan, dan kebutuhan individual atlet.

4. **Perlakuan dan tekanan psikologis terhadap atlet**

Periksa dugaan penghinaan, intimidasi, ancaman eliminasi, dan respons pelatih terhadap keluhan atlet.

5. **Kualitas program dan evaluasi prestasi**

Minta program latihan tertulis, evaluasi setiap atlet, target perkembangan, dan rencana perbaikan menuju kompetisi berikutnya.

6. **Pengawasan organisasi terhadap pelatih**

Periksa mekanisme evaluasi kinerja, pertanggungjawaban tugas, pengelolaan dana, dan saluran pengaduan atlet.

## IX. Kesimpulan besar

Ada satu pola yang sangat menonjol.

Atlet dituntut menghasilkan prestasi, tetapi sistem yang mendukung pencapaian prestasi tersebut belum terlihat berjalan dengan kualitas yang sebanding.

Atlet diminta disiplin, tetapi kedisiplinan pelatih dipertanyakan.

Atlet diminta memahami teknik, tetapi metode transfer ilmunya dipertanyakan.

Atlet diminta bertanggung jawab atas kekalahan, tetapi evaluasi kualitas pembinaan belum terlihat.

Atlet diminta menyerahkan uang, tetapi transparansi penggunaannya dipertanyakan.

Atlet diminta meningkatkan mental, tetapi perlakuan yang diterima justru berpotensi melemahkan mental.

Dan inilah hal paling mendasar:

> Jangan hanya mengukur kualitas atlet dari medali yang berhasil dibawa pulang. Ukur juga kualitas orang-orang yang bertanggung jawab membentuk atlet tersebut.

Target emas 2028 tidak cukup dibangun dengan tuntutan, teriakan, hukuman, dan penambahan materi latihan.

Diperlukan sistem pembinaan yang bisa dipertanggungjawabkan.
  </script>
  <script>
    const source = document.getElementById('markdown-source').textContent.trim();
    const target = document.getElementById('document');
    const escapeHTML = (text) => text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const inline = (text) => escapeHTML(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
    const rows = source.split(/\r?\n/);
    const blocks = [];
    let i = 0;
    while (i < rows.length) {
      const line = rows[i].trim();
      if (!line) { i++; continue; }
      const heading = line.match(/^(#{1,6})\s+(.+)$/);
      if (heading) {
        const level = heading[1].length;
        blocks.push(`<h${level}>${inline(heading[2])}</h${level}>`);
        i++;
        continue;
      }
      if (line.startsWith('> ')) {
        const quote = [];
        while (i < rows.length && rows[i].trim().startsWith('> ')) quote.push(rows[i++].trim().slice(2));
        blocks.push(`<blockquote><p>${inline(quote.join(' '))}</p></blockquote>`);
        continue;
      }
      if (line.startsWith('|')) {
        const tableLines = [];
        while (i < rows.length && rows[i].trim().startsWith('|')) tableLines.push(rows[i++].trim());
        const cells = (row) => row.replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
        const tableRows = tableLines.filter(row => !/^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(row));
        if (tableRows.length) {
          const headerCells = cells(tableRows[0]);
          const bodyRows = tableRows.slice(1).map(cells);
          blocks.push(`<table><thead><tr>${headerCells.map(cell => `<th>${inline(cell)}</th>`).join('')}</tr></thead><tbody>${bodyRows.map(row => `<tr>${row.map(cell => `<td>${inline(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
        }
        continue;
      }
      if (/^[-*]\s+/.test(line)) {
        const items = [];
        while (i < rows.length && /^\s*[-*]\s+/.test(rows[i])) items.push(rows[i++].trim().replace(/^[-*]\s+/, ''));
        blocks.push(`<ul>${items.map(item => `<li>${inline(item)}</li>`).join('')}</ul>`);
        continue;
      }
      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        const startNumber = Number(line.match(/^(\d+)\./)[1]);
        while (i < rows.length && /^\s*\d+\.\s+/.test(rows[i])) items.push(rows[i++].trim().replace(/^\d+\.\s+/, ''));
        blocks.push(`<ol start="${startNumber}">${items.map(item => `<li>${inline(item)}</li>`).join('')}</ol>`);
        continue;
      }
      const paragraph = [line];
      i++;
      while (i < rows.length && rows[i].trim() && !/^(#{1,6})\s+/.test(rows[i].trim()) && !rows[i].trim().startsWith('> ') && !rows[i].trim().startsWith('|') && !/^\s*[-*]\s+/.test(rows[i]) && !/^\s*\d+\.\s+/.test(rows[i])) paragraph.push(rows[i++].trim());
      blocks.push(`<p>${inline(paragraph.join(' '))}</p>`);
    }
    const parsed = document.createElement('div');
    parsed.innerHTML = blocks.join('\n');
    const tabGroups = [
      { label: 'Pembukaan', nodes: [] },
      { label: 'Pembinaan', nodes: [] },
      { label: 'Etika', nodes: [] },
      { label: 'Keuangan', nodes: [] },
      { label: 'Pertandingan & Atlet', nodes: [] },
      { label: 'Evaluasi', nodes: [] },
      { label: 'Prioritas', nodes: [] },
      { label: 'Kesimpulan', nodes: [] }
    ];
    let groupIndex = 0;
    const sectionTabs = new Map([
      ['I. Kualitas pembinaan dan metode kepelatihan', 1],
      ['II. Profesionalitas, komunikasi, dan etika pelatih', 2],
      ['III. Keuangan dan akuntabilitas', 3],
      ['IV. Persiapan dan pelaksanaan pertandingan', 4],
      ['VI. Evaluasi, pengawasan, dan tanggung jawab organisasi', 5],
      ['VIII. Temuan paling serius yang perlu diprioritaskan', 6],
      ['IX. Kesimpulan besar', 7]
    ]);
    for (const node of Array.from(parsed.children)) {
      const text = node.textContent.trim();
      if (node.tagName === 'H2' && sectionTabs.has(text)) groupIndex = sectionTabs.get(text);
      tabGroups[groupIndex].nodes.push(node);
    }

    const nav = document.createElement('div');
    nav.className = 'tab-nav';
    nav.setAttribute('role', 'tablist');
    nav.setAttribute('aria-label', 'Bagian laporan');
    const buttons = [];
    const panels = [];
    tabGroups.forEach((group, index) => {
      const button = document.createElement('button');
      button.className = 'tab-button';
      button.type = 'button';
      button.id = `report-tab-${index}`;
      button.setAttribute('role', 'tab');
      button.setAttribute('aria-controls', `report-panel-${index}`);
      button.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
      button.setAttribute('tabindex', index === 0 ? '0' : '-1');
      button.innerHTML = `<span class="tab-number">${String(index + 1).padStart(2, '0')}</span><span>${group.label}</span>`;
      nav.appendChild(button);
      buttons.push(button);

      const panel = document.createElement('section');
      panel.className = 'tab-panel';
      panel.id = `report-panel-${index}`;
      panel.setAttribute('role', 'tabpanel');
      panel.setAttribute('aria-labelledby', button.id);
      panel.tabIndex = 0;
      if (index !== 0) panel.hidden = true;
      group.nodes.forEach(node => panel.appendChild(node));
      panels.push(panel);
    });
    target.replaceChildren(nav, ...panels);

    const activateTab = (index, moveFocus = false) => {
      buttons.forEach((button, buttonIndex) => {
        const selected = buttonIndex === index;
        button.setAttribute('aria-selected', selected ? 'true' : 'false');
        button.setAttribute('tabindex', selected ? '0' : '-1');
        panels[buttonIndex].hidden = !selected;
      });
      if (moveFocus) buttons[index].focus();
    };
    buttons.forEach((button, index) => button.addEventListener('click', () => activateTab(index)));
    nav.addEventListener('keydown', event => {
      const current = buttons.indexOf(document.activeElement);
      if (current < 0) return;
      if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        event.preventDefault();
        activateTab((current + 1) % buttons.length, true);
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        event.preventDefault();
        activateTab((current - 1 + buttons.length) % buttons.length, true);
      } else if (event.key === 'Home') {
        event.preventDefault();
        activateTab(0, true);
      } else if (event.key === 'End') {
        event.preventDefault();
        activateTab(buttons.length - 1, true);
      }
    });
  </script>
